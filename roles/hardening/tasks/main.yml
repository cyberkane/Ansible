---
- name: Ensure sudo package is installed
  ansible.builtin.package:
    name: sudo
    state: present

- name: Determine administrative sudo group name
  ansible.builtin.set_fact:
    hardening_sudo_group: "{{ 'sudo' if ansible_facts['os_family'] in ['Debian', 'Astra Linux'] else 'wheel' }}"

- name: Ensure administrative group exists
  ansible.builtin.group:
    name: '{{ hardening_sudo_group }}'
    state: present

- name: Ensure sudoers.d directory exists
  ansible.builtin.file:
    path: "{{ '/usr/local/etc/sudoers.d' if ansible_facts['os_family'] == 'FreeBSD' else '/etc/sudoers.d' }}"
    state: directory
    owner: root
    group: "{{ 'wheel' if ansible_facts['os_family'] == 'FreeBSD' else 'root' }}"
    mode: '0750'

- name: Allow administrative group to use sudo
  ansible.builtin.copy:
    content: "%{{ hardening_sudo_group }} ALL=(ALL:ALL) ALL\n"
    dest: "{{ '/usr/local/etc/sudoers.d/10-admins' if ansible_facts['os_family'] == 'FreeBSD' else '/etc/sudoers.d/10-admins' }}"
    owner: root
    group: "{{ 'wheel' if ansible_facts['os_family'] == 'FreeBSD' else 'root' }}"
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Find all public SSH key files in role files directory
  ansible.builtin.set_fact:
    hardening_pub_keys: "{{ query('fileglob', role_path + '/files/*.pub') }}"

- name: Create administrative users from SSH key filenames
  ansible.builtin.user:
    name: '{{ item | basename | splitext | first }}'
    groups: '{{ hardening_sudo_group }}'
    append: true
    shell: "{{ '/bin/sh' if ansible_facts['os_family'] in ['Alpine', 'FreeBSD'] else '/bin/bash' }}"
    password: '*'
    update_password: on_create
    create_home: true
    state: present
  loop: '{{ hardening_pub_keys }}'
  loop_control:
    label: '{{ item | basename | splitext | first }}'

- name: Add authorized SSH keys for administrative users
  ansible.posix.authorized_key:
    user: '{{ item | basename | splitext | first }}'
    state: present
    key: "{{ lookup('file', item) }}"
  loop: '{{ hardening_pub_keys }}'
  loop_control:
    label: '{{ item | basename }}'

- name: Ensure SSH host keys exist
  ansible.builtin.command:
    cmd: ssh-keygen -A
    creates: /etc/ssh/ssh_host_ed25519_key

- name: Ensure privilege separation directory exists (Linux)
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_facts['os_family'] != 'FreeBSD'

- name: Deploy hardened sshd_config from Jinja2 template
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: "{{ 'wheel' if ansible_facts['os_family'] == 'FreeBSD' else 'root' }}"
    mode: '0600'
    validate: 'sshd -t -f %s'
  notify: Reload sshd service
