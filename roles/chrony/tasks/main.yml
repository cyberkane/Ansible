---
- name: Install chrony package on target host
  ansible.builtin.package:
    name: chrony
    state: present

- name: Ensure chrony configuration and log directories exist
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    mode: '0755'
  loop:
    - /etc/chrony
    - /var/log/chrony
    - /var/lib/chrony

- name: Deploy chrony configuration from Jinja2 template
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: '{{ chrony_conf_path }}'
    owner: root
    group: root
    mode: '0644'
  notify: Validate chrony configuration
