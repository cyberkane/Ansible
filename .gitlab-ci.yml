stages:
  - lint
  - deploy

variables:
  # Отключаем проверку SSH-ключей хостов, чтобы пайплайн не зависал на вопросе (yes/no)
  ANSIBLE_HOST_KEY_CHECKING: 'False'
  # Включаем цветной вывод в логах GitLab
  ANSIBLE_FORCE_COLOR: 'True'

# Общий шаблон подготовки SSH-ключа перед выполнением задач
.ssh_setup: &ssh_setup
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    # Быстрая проверка, что ключ прочитался без ошибок (выведет публичную часть в лог)
    - ssh-keygen -y -f ~/.ssh/id_ed25519

syntax_check:
  stage: lint
  image: cytopia/ansible:latest
  tags:
    - Ansible
  script:
    - ansible-playbook --syntax-check -i inventory/base.yaml base.yaml

deploy_servers:
  stage: deploy
  image: cytopia/ansible:latest
  tags:
    - Ansible
  <<: *ssh_setup
  script:
    - ansible-playbook -i inventory/base.yaml base.yaml
  only:
    - main
