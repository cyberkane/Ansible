stages:
  - lint
  - deploy

variables:
  ANSIBLE_HOST_KEY_CHECKING: 'False'
  ANSIBLE_FORCE_COLOR: 'True'

.ssh_setup: &ssh_setup
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519

# Шаг 1.1: Быстрая проверка базового синтаксиса
syntax_check:
  stage: lint
  image: cytopia/ansible:latest
  tags:
    - Ansible
  script:
    - ansible-playbook --syntax-check -i inventory/base.yaml base.yaml

# Шаг 1.2: Глубокая проверка стандартов и лучших практик
ansible_lint:
  stage: lint
  image: cytopia/ansible-lint:latest
  tags:
    - Ansible
  script:
    # Флаг --force-color сохраняет цветной вывод ошибок в логах GitLab
    - ansible-lint --force-color base.yaml

deploy_servers:
  stage: deploy
  image: cytopia/ansible:latest
  tags:
    - Ansible
  <<: *ssh_setup
  script:
    - ansible-playbook -i inventory/base.yaml base.yaml
  only:
    - main
