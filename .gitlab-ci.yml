stages:
  - lint
  - dry_run
  - deploy

variables:
  ANSIBLE_HOST_KEY_CHECKING: 'False'
  ANSIBLE_FORCE_COLOR: 'True'
  ANSIBLE_CONFIG: './ansible.cfg'

.ssh_setup: &ssh_setup
  before_script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519

syntax_check:
  stage: lint
  image:
    name: local/ansible-runner:latest
    pull_policy: if-not-present
  tags:
    - Ansible
  script:
    - ansible-playbook --syntax-check -i inventory/inventory.yaml base.yaml

ansible_lint:
  stage: lint
  image:
    name: local/ansible-runner:latest
    pull_policy: if-not-present
  tags:
    - Ansible
  script:
    - ansible-lint --force-color

dry_run_servers:
  stage: dry_run
  image:
    name: local/ansible-runner:latest
    pull_policy: if-not-present
  tags:
    - Ansible
  <<: *ssh_setup
  script:
    - ansible-playbook --check --diff -i inventory/inventory.yaml base.yaml
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy_servers:
  stage: deploy
  image:
    name: local/ansible-runner:latest
    pull_policy: if-not-present
  tags:
    - Ansible
  resource_group: test-environment
  <<: *ssh_setup
  script:
    - ansible-playbook -i inventory/inventory.yaml base.yaml
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
